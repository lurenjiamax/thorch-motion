<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="net.hadess.SensorProxy"/>
  </policy>
  <policy context="default">
    <deny own="net.hadess.SensorProxy"/>
    <allow send_destination="net.hadess.SensorProxy"
           send_path="/net/hadess/SensorProxy"
           send_interface="net.hadess.SensorProxy"
           send_member="ClaimAccelerometer"/>
    <allow send_destination="net.hadess.SensorProxy"
           send_path="/net/hadess/SensorProxy"
           send_interface="net.hadess.SensorProxy"
           send_member="ReleaseAccelerometer"/>
    <allow send_destination="net.hadess.SensorProxy"
           send_path="/net/hadess/SensorProxy"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="net.hadess.SensorProxy"
           send_path="/net/hadess/SensorProxy"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="net.hadess.SensorProxy"
           send_path="/net/hadess/SensorProxy"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="net.hadess.SensorProxy"
           send_path="/net/hadess/SensorProxy"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
</busconfig>
